<script>
"use strict";

/* ============================================================

const SUPABASE_URL = 'https://clxmcteqxmegyuzbeqxu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNseG1jdGVxeG1lZ3l1emJlcXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzAyNjYsImV4cCI6MjEwNDEwNjI2Nn0.0Sh9S5H9_nBNnDbz3P2Ux1n4itoxvSDZtdHA9crE6aE';
const db = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================================================
   PRODUTOS PADRÃO E TURNOS
============================================================ */
const PRODUTOS_PADRAO = [
  {id:1, nome:"Coca-Cola Zero", cat:"Bebida", preco:3.99, estoqueInicial:11},
  {id:2, nome:"YoPRO Coco e Batata Doce", cat:"Suplemento", preco:10.00, estoqueInicial:6},
  {id:3, nome:"YoPRO Frutas Vermelhas", cat:"Suplemento", preco:10.00, estoqueInicial:2},
  {id:4, nome:"YoPRO Chocolate", cat:"Suplemento", preco:10.00, estoqueInicial:5},
  {id:5, nome:"YoPRO Energy Boost", cat:"Suplemento", preco:10.00, estoqueInicial:3},
  {id:6, nome:"Monster Zero Açúcar", cat:"Energético", preco:11.99, estoqueInicial:31},
  {id:7, nome:"Monster Taurina", cat:"Energético", preco:11.99, estoqueInicial:5},
  {id:8, nome:"Monster Ultra Violet", cat:"Energético", preco:11.99, estoqueInicial:11},
  {id:9, nome:"Monster Ultra", cat:"Energético", preco:11.99, estoqueInicial:8},
  {id:10, nome:"Leão Com Gás", cat:"Bebida", preco:4.99, estoqueInicial:14},
  {id:11, nome:"Powerade Uva", cat:"Isotônico", preco:5.99, estoqueInicial:1},
  {id:12, nome:"Powerade Mix de Frutas", cat:"Isotônico", preco:5.99, estoqueInicial:5},
  {id:13, nome:"Powerade Laranja", cat:"Isotônico", preco:5.99, estoqueInicial:4},
  {id:14, nome:"Água Com Gás", cat:"Bebida", preco:2.99, estoqueInicial:13},
  {id:15, nome:"Água Cristal", cat:"Bebida", preco:2.99, estoqueInicial:16}
];

const CONFERENCIAS = [
  {id:"m_entrada", turno:"Manhã", tipo:"Entrada", hora:"05:00"},
  {id:"m_saida", turno:"Manhã", tipo:"Saída", hora:"11:00"},
  {id:"t_entrada", turno:"Tarde", tipo:"Entrada", hora:"11:00"},
  {id:"t_saida", turno:"Tarde", tipo:"Saída", hora:"17:00"},
  {id:"n_entrada", turno:"Noite", tipo:"Entrada", hora:"17:00"},
  {id:"n_saida", turno:"Noite", tipo:"Saída", hora:"22:00"}
];

const RESPONSAVEIS = ["Gabrielle", "Adryel", "Hugo"];

/* ============================================================
   ESTADO DA APLICAÇÃO
============================================================ */
let state = {
  modo: "recepcao",
  abaAdmin: "resumo",
  data: hoje(),
  conf: 0,
  produtos: carregarProdutos(),
  dia: null,
  modal: null,
  toast: null,
  logs: carregarLogs()
};

/* ============================================================
   UTILITÁRIOS
============================================================ */
function hoje() {
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function dinheiro(v) {
  return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dataBR(v) {
  if (!v) return "—";
  const [a, m, d] = v.split("-");
  return `${d}/${m}/${a}`;
}

function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function carregarLogs() {
  try {
    return JSON.parse(localStorage.getItem("nowfit_logs")) || [];
  } catch(e) { return []; }
}

function registrarLog(msg) {
  const timestamp = new Date().toLocaleTimeString("pt-BR");
  state.logs.unshift(`[${timestamp}] ${msg}`);
  localStorage.setItem("nowfit_logs", JSON.stringify(state.logs.slice(0, 50)));
}

/* ============================================================
   GERENCIAMENTO DE PRODUTOS E DIAS
============================================================ */
function carregarProdutos() {
  try {
    const raw = localStorage.getItem("nowfit_cedro_produtos");
    if (raw) {
      const produtos = JSON.parse(raw);
      if (Array.isArray(produtos)) return produtos;
    }
  } catch (e) {}

  const copia = JSON.parse(JSON.stringify(PRODUTOS_PADRAO));
  localStorage.setItem("nowfit_cedro_produtos", JSON.stringify(copia));
  return copia;
}

function salvarProdutos() {
  localStorage.setItem("nowfit_cedro_produtos", JSON.stringify(state.produtos));
}

function novoRegistro() {
  const produtos = {};
  state.produtos.forEach(p => {
    produtos[p.id] = { reposicao: "", vendido: "", ajuste: null };
  });
  return { responsavel: "", produtos, finalizado: false, finalizadoEm: null };
}

function novoDia() {
  const dia = { versao: 3, estoqueInicial: {}, conferencias: [] };
  state.produtos.forEach(p => {
    dia.estoqueInicial[p.id] = Number(p.estoqueInicial || 0);
  });
  for (let i = 0; i < CONFERENCIAS.length; i++) {
    dia.conferencias.push(novoRegistro());
  }
  return dia;
}

function chaveDia() {
  return "nowfit_cedro_dia:" + state.data;
}

function carregarDia() {
  try {
    const raw = localStorage.getItem(chaveDia());
    if (raw) {
      const dia = JSON.parse(raw);
      if (!dia.estoqueInicial) dia.estoqueInicial = {};
      if (!Array.isArray(dia.conferencias)) dia.conferencias = [];
      while (dia.conferencias.length < CONFERENCIAS.length) {
        dia.conferencias.push(novoRegistro());
      }
      state.produtos.forEach(p => {
        if (dia.estoqueInicial[p.id] === undefined) {
          dia.estoqueInicial[p.id] = Number(p.estoqueInicial || 0);
        }
        dia.conferencias.forEach(reg => {
          if (!reg.produtos) reg.produtos = {};
          if (!reg.produtos[p.id]) {
            reg.produtos[p.id] = { reposicao: "", vendido: "", ajuste: null };
          }
        });
      });
      return dia;
    }
  } catch (e) {}
  return novoDia();
}

function salvarDia() {
  localStorage.setItem(chaveDia(), JSON.stringify(state.dia));
}

state.dia = carregarDia();

/* ============================================================
   CÁLCULOS DE ESTOQUE
============================================================ */
function estoqueAnterior(index, pid) {
  if (index === 0) {
    return Number(state.dia.estoqueInicial[pid] || 0);
  }
  return estoqueFinal(index - 1, pid);
}

function estoqueFinal(index, pid) {
  const anterior = estoqueAnterior(index, pid);
  const registro = state.dia.conferencias[index];
  const item = registro?.produtos?.[pid] || {};

  if (item.ajuste !== null && item.ajuste !== undefined && item.ajuste !== "") {
    return Number(item.ajuste) || 0;
  }

  const reposicao = Number(item.reposicao) || 0;
  const vendido = Number(item.vendido) || 0;
  return anterior + reposicao - vendido;
}

/* ============================================================
   AÇÕES E MANIPULAÇÃO DE TURNOS
============================================================ */
function finalizarTurno() {
  const index = state.conf;
  const registro = state.dia.conferencias[index];

  if (!registro.responsavel) {
    toast("Selecione o responsável antes de finalizar o turno.", true);
    return;
  }

  registro.finalizado = true;
  registro.finalizadoEm = new Date().toISOString();
  salvarDia();

  registrarLog(`Turno ${CONFERENCIAS[index].turno} (${CONFERENCIAS[index].tipo}) finalizado por ${registro.responsavel}.`);

  if (index < CONFERENCIAS.length - 1) {
    state.conf = index + 1;
    toast("Turno finalizado! Avançando para o próximo turno.");
  } else {
    toast("Último turno finalizado! Dia encerrado.");
  }
  render();
}

function reabrirTurno() {
  const index = state.conf;
  const registro = state.dia.conferencias[index];

  registro.finalizado = false;
  registro.finalizadoEm = null;
  salvarDia();

  registrarLog(`Turno ${CONFERENCIAS[index].turno} (${CONFERENCIAS[index].tipo}) foi REABERTO.`);
  toast("Turno reaberto para edições!");
  render();
}

function alterarCampo(pid, campo, valor) {
  const registro = state.dia.conferencias[state.conf];
  if (registro.finalizado) return;

  if (!registro.produtos[pid]) {
    registro.produtos[pid] = { reposicao: "", vendido: "", ajuste: null };
  }
  registro.produtos[pid][campo] = valor;
  salvarDia();
  atualizarLinhaProduto(pid);
  atualizarTotais();
}

function alterarResponsavel(valor) {
  state.dia.conferencias[state.conf].responsavel = valor;
  salvarDia();
}

function ajustarEstoque(pid, valor) {
  const registro = state.dia.conferencias[state.conf];
  if (!registro.produtos[pid]) {
    registro.produtos[pid] = { reposicao: "", vendido: "", ajuste: null };
  }
  registro.produtos[pid].ajuste = valor === "" ? null : Number(valor);
  salvarDia();
  atualizarLinhaProduto(pid);
  atualizarLinhaAjuste(pid);
  atualizarTotais();
}

/* ============================================================
   ATUALIZAÇÕES DINÂMICAS DO DOM
============================================================ */
function atualizarLinhaProduto(pid) {
  const registro = state.dia.conferencias[state.conf];
  const item = registro.produtos[pid] || {};
  const atual = estoqueFinal(state.conf, pid);
  const vendido = Number(item.vendido) || 0;
  const produto = state.produtos.find(p => p.id === pid);
  const faturado = vendido * Number(produto?.preco || 0);

  const linha = document.querySelector(`[data-linha-produto="${pid}"]`);
  if (!linha) return;

  const celAnterior = linha.querySelector("[data-cel-anterior]");
  if (celAnterior) celAnterior.textContent = estoqueAnterior(state.conf, pid);

  const celAtual = linha.querySelector("[data-cel-atual]");
  if (celAtual) {
    celAtual.textContent = atual;
    celAtual.classList.toggle("neg", atual < 0);
    celAtual.classList.toggle("ok", atual >= 0);
  }

  const celFaturado = linha.querySelector("[data-cel-faturado]");
  if (celFaturado) celFaturado.textContent = dinheiro(faturado);
}

function atualizarLinhaAjuste(pid) {
  const linha = document.querySelector(`[data-linha-ajuste="${pid}"]`);
  if (!linha) return;

  const registro = state.dia.conferencias[state.conf];
  const item = registro.produtos[pid] || {};
  const anterior = estoqueAnterior(state.conf, pid);
  const reposicao = Number(item.reposicao) || 0;
  const vendido = Number(item.vendido) || 0;
  const calculado = anterior + reposicao - vendido;

  const calculadoEl = linha.querySelector("[data-cel-calculado]");
  if (calculadoEl) calculadoEl.textContent = calculado;

  const ajuste = item.ajuste;
  const transferido = (ajuste !== null && ajuste !== undefined && ajuste !== "") ? Number(ajuste) : calculado;

  const transferidoEl = linha.querySelector("[data-cel-transferido]");
  if (transferidoEl) transferidoEl.textContent = transferido;
}

function atualizarTotais() {
  const registro = state.dia.conferencias[state.conf];
  let totalQtd = 0;
  let totalFat = 0;

  state.produtos.forEach(p => {
    const item = registro.produtos[p.id] || {};
    const qtd = Number(item.vendido) || 0;
    totalQtd += qtd;
    totalFat += qtd * Number(p.preco || 0);
  });

  const qtdEl = document.querySelector("[data-total-qtd]");
  if (qtdEl) qtdEl.textContent = totalQtd;

  const fatEl = document.querySelector("[data-total-fat]");
  if (fatEl) fatEl.textContent = dinheiro(totalFat);
}

function toast(msg, erro = false) {
  state.toast = { msg, erro };
  render();
  setTimeout(() => {
    state.toast = null;
    render();
  }, 3000);
}

/* ============================================================
   EXPORTAÇÃO E INTEGRAÇÕES
============================================================ */
function obterProdutosBaixoEstoque() {
  return state.produtos.filter(p => estoqueFinal(state.conf, p.id) < 5);
}

function textoConferencia() {
  const conf = CONFERENCIAS[state.conf];
  const registro = state.dia.conferencias[state.conf];
  let totalQtd = 0, totalFat = 0, totalReposto = 0;
  let linhasVendas = "", linhasReposicao = "";

  state.produtos.forEach(p => {
    const item = registro.produtos[p.id] || {};
    const qtd = Number(item.vendido) || 0;
    const reposto = Number(item.reposicao) || 0;

    if (qtd > 0) {
      const fat = qtd * Number(p.preco || 0);
      totalQtd += qtd;
      totalFat += fat;
      linhasVendas += `• ${p.nome}: ${qtd}x — ${dinheiro(fat)}\n`;
    }

    if (reposto > 0) {
      totalReposto += reposto;
      linhasReposicao += `• ${p.nome}: +${reposto}\n`;
    }
  });

  const produtosBaixow = obterProdutosBaixoEstoque();
  let textoAlertas = "";
  if (produtosBaixow.length > 0) {
    textoAlertas = produtosBaixow.map(p => `🚨 *${p.nome}*: Restam apenas ${estoqueFinal(state.conf, p.id)} un.`).join("\n");
  } else {
    textoAlertas = "✅ Todos os produtos com estoque adequado.";
  }

  return `*NOWFIT CEDRO — CONFERÊNCIA*\n` +
    `*${conf.turno} — ${conf.tipo}*\n` +
    `Data: ${dataBR(state.data)}\n` +
    `Horário: ${conf.hora}\n` +
    `Responsável: ${registro.responsavel || "—"}\n\n` +
    `*REPOSIÇÃO*\n` + (linhasReposicao || "Nenhuma reposição registrada.\n") +
    `Total reposto: ${totalReposto}\n\n` +
    `*VENDAS*\n` + (linhasVendas || "Nenhuma venda registrada.\n") +
    `\n*Itens vendidos:* ${totalQtd}\n` +
    `*Faturamento:* ${dinheiro(totalFat)}\n\n` +
    `*ESTOQUE BAIXO (<5 un):*\n` + textoAlertas;
}

function enviarWhatsApp() {
  window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(textoConferencia()), "_blank");
}

function copiarTextoPlanilha() {
  const txt = textoConferencia();
  navigator.clipboard.writeText(txt).then(() => {
    toast("Dados do turno copiados com sucesso!");
  }).catch(() => {
    toast("Erro ao copiar os dados.", true);
  });
}

function exportarExcelCSV() {
  let csvContent = "data:text/csv;charset=utf-8,ID,Produto,Categoria,Preco (RS),Estoque Inicial,Vendidos,Estoque Atual,Status\n";
  const registro = state.dia.conferencias[state.conf];

  state.produtos.forEach(p => {
    const item = registro.produtos[p.id] || {};
    const atual = estoqueFinal(state.conf, p.id);
    const status = atual < 5 ? "ESTOQUE BAIXO" : "OK";
    csvContent += `${p.id},"${p.nome}","${p.cat}",${p.preco},${estoqueAnterior(state.conf, p.id)},${item.vendido||0},${atual},${status}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `estoque_nowfit_${state.data}_turno${state.conf+1}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function imprimirRelatorioPDF() {
  window.print();
}

/* ============================================================
   CÁLCULOS DO ADMINISTRATIVO
============================================================ */
function calcularResumo() {
  let faturamento = 0, vendidos = 0, estoque = 0, repostoTotal = 0;
  const porTurno = { Manhã: 0, Tarde: 0, Noite: 0 };
  const porProduto = {};

  state.produtos.forEach(p => {
    porProduto[p.id] = { nome: p.nome, qtd: 0, fat: 0, reposto: 0 };
    let final = Number(state.dia.estoqueInicial[p.id] || 0);

    CONFERENCIAS.forEach((conf, index) => {
      const registro = state.dia.conferencias[index];
      const item = registro?.produtos?.[p.id] || {};
      const qtd = Number(item.vendido) || 0;
      const reposicao = Number(item.reposicao) || 0;
      const fat = qtd * Number(p.preco || 0);

      faturamento += fat;
      vendidos += qtd;
      repostoTotal += reposicao;
      porTurno[conf.turno] += fat;

      porProduto[p.id].qtd += qtd;
      porProduto[p.id].fat += fat;
      porProduto[p.id].reposto += reposicao;

      if (item.ajuste !== null && item.ajuste !== undefined && item.ajuste !== "") {
        final = Number(item.ajuste) || 0;
      } else {
        final = final + reposicao - qtd;
      }
    });

    estoque += final;
  });

  return { faturamento, vendidos, estoque, repostoTotal, porTurno, porProduto };
}

/* ============================================================
   INTERFACE DE USUÁRIO (RENDER)
============================================================ */

  const app = document.getElementById("app");
  app.innerHTML = renderHeader() +
    (state.modo === "recepcao" ? renderRecepcao() : renderAdmin()) +
    (state.modal ? renderModal() : "") +
    (state.toast ? `<div class="toast" style="background:${state.toast.erro ? "#ff4d4d" : "#c6ff00"}">${esc(state.toast.msg)}</div>` : "");

  bind();
}

function renderHeader() {

          <div class="brand-sub">Unidade Cedro · Controle de Estoque & Turnos</div>
        </div>
      </div>
      <div class="toggle">
        <button class="${state.modo === "recepcao" ? "active" : ""}" data-action="recepcao">Recepção</button>
        <button class="${state.modo === "administrativo" ? "active" : ""}" data-action="admin">Painel Administrativo</button>

}

          </span>
        </div>
        <button class="btn whatsapp" style="padding:6px 12px; font-size:.75rem;" onclick="enviarWhatsApp()">Enviar Alerta</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>NOWFIT CEDRO — RELATÓRIO DE ESTOQUE (${conf.turno} - ${conf.tipo})</span>
          <span style="font-size:.72rem">${conf.hora} | Data: ${dataBR(state.data)} ${turnoFinalizado ? '<b style="color:#00e0a4;">[CONCLUÍDO]</b>' : ''}</span>
        </div>
        <div class="card-body">
          <div class="field">
            <label class="label">Responsável pela conferência</label>
            <select id="responsavel" class="select" ${turnoFinalizado ? 'disabled' : ''}>

              ${RESPONSAVEIS.map(nome => `
                <option value="${esc(nome)}" ${registro.responsavel === nome ? "selected" : ""}>${esc(nome)}</option>
              `).join("")}
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span>Produtos do Estoque</span></div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Anterior</th>
                  <th>Reposição</th>
                  <th>Vendido</th>
                  <th>Atual</th>
                  <th>Faturado</th>
                </tr>
              </thead>
              <tbody>
                ${state.produtos.map(p => {
                  const item = registro.produtos[p.id] || {};
                  const anterior = estoqueAnterior(state.conf, p.id);
                  const atual = estoqueFinal(state.conf, p.id);
                  const vendido = Number(item.vendido) || 0;
                  const faturado = vendido * Number(p.preco || 0);

                  return `
                    <tr data-linha-produto="${p.id}">
                      <td>
                        <div class="product-name">${esc(p.nome)}</div>
                        <span class="tag">${esc(p.cat)} · ${dinheiro(p.preco)}</span>
                      </td>
                      <td data-cel-anterior>${anterior}</td>
                      <td>
                        <input class="number" type="number" min="0" value="${esc(item.reposicao)}"
                          ${turnoFinalizado ? 'disabled' : ''}
                          oninput="alterarCampo(${p.id}, 'reposicao', this.value)">
                      </td>
                      <td>
                        <input class="number" type="number" min="0" value="${esc(item.vendido)}"
                          ${turnoFinalizado ? 'disabled' : ''}
                          oninput="alterarCampo(${p.id}, 'vendido', this.value)">
                      </td>
                      <td class="stock ${atual < 0 ? 'neg' : 'ok'}" data-cel-atual>${atual}</td>
                      <td data-cel-faturado>${dinheiro(faturado)}</td>

          <span class="summary-label">Faturamento do Turno</span>
          <div class="summary-value" style="color:#c6ff00" data-total-fat>${dinheiro(totalFat)}</div>

      </div>

      <!-- Botões de Ação com Concluir / Reabrir Turno -->
      <div class="actions">
        ${!turnoFinalizado ? `

        ` : `
          <button class="btn reopen" onclick="reabrirTurno()">🔓 Reabrir Turno</button>
        `}

      </div>

        <div class="assinatura-box">

          NOWfit Academia - Unidade Cedro
        </div>

    </main>
  `;
}

function renderAdmin() {
  const res = calcularResumo();

  return `
    <main class="container">
      <div class="admin-tabs">
        <button class="btn ${state.abaAdmin === "resumo" ? "primary" : "secondary"}" onclick="state.abaAdmin='resumo';render();">Resumo Geral</button>
        <button class="btn ${state.abaAdmin === "produtos" ? "primary" : "secondary"}" onclick="state.abaAdmin='produtos';render();">Gerenciar Produtos</button>
        <button class="btn ${state.abaAdmin === "ajuste" ? "primary" : "secondary"}" onclick="state.abaAdmin='ajuste';render();">Ajuste Físico</button>
        <button class="btn ${state.abaAdmin === "logs" ? "primary" : "secondary"}" onclick="state.abaAdmin='logs';render();">Logs / Auditoria</button>
      </div>

      ${state.abaAdmin === "resumo" ? `
        <div class="kpis">
          <div class="kpi">
            <div class="kpi-label">Faturamento Total do Dia</div>
            <div class="kpi-value" style="color:#c6ff00">${dinheiro(res.faturamento)}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Total de Itens Vendidos</div>
            <div class="kpi-value">${res.vendidos} un</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Estoque Total Restante</div>
            <div class="kpi-value">${res.estoque} un</div>
          </div>
        </div>
      ` : ""}

      ${state.abaAdmin === "produtos" ? `
        <div class="actions" style="margin-bottom: 15px;">

        </div>
        <div class="card">
          <div class="card-body">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque Inicial</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.produtos.map(p => `
                    <tr>
                      <td class="product-name">${esc(p.nome)}</td>
                      <td><span class="tag">${esc(p.cat)}</span></td>
                      <td>${dinheiro(p.preco)}</td>
                      <td>${p.estoqueInicial}</td>
                      <td>
                        <button class="btn danger" style="padding:4px 8px; font-size:.7rem;" onclick="removerProduto(${p.id})">Excluir</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      ` : ""}

      ${state.abaAdmin === "ajuste" ? `
        <div class="card">
          <div class="card-title"><span>Ajuste Físico de Estoque</span></div>
          <div class="card-body">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Produto</th>
                    <th>Estoque Calculado</th>
                    <th>Ajuste Contado</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.produtos.map(p => {
                    const item = state.dia.conferencias[state.conf]?.produtos?.[p.id] || {};
                    const anterior = estoqueAnterior(state.conf, p.id);
                    const reposicao = Number(item.reposicao) || 0;
                    const vendido = Number(item.vendido) || 0;

                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>

      ${state.abaAdmin === "logs" ? `
        <div class="history-box">

function renderModal() {
  if (state.modal === 'novo_produto') {
    return `
      <div class="modal-bg">
        <div class="modal">
          <h3 style="margin-top:0;">Cadastrar Novo Produto</h3>
          <form class="form-grid" onsubmit="salvarNovoProduto(event)">
            <input id="p_nome" class="input" type="text" placeholder="Nome do Produto" required>
            <input id="p_cat" class="input" type="text" placeholder="Categoria" required>
            <input id="p_preco" class="input" type="number" step="0.01" placeholder="Preço (R$)" required>
            <input id="p_qtd" class="input" type="number" placeholder="Estoque Inicial" required>
            <div class="modal-actions">
              <button class="btn secondary" type="button" onclick="state.modal=null;render();">Cancelar</button>
              <button class="btn primary" type="submit">Salvar Produto</button>
            </div>
          </form>
        </div>
      </div>
    `;
  }
  return "";
}

function salvarNovoProduto(e) {
  e.preventDefault();
  const nome = document.getElementById("p_nome").value;
  const cat = document.getElementById("p_cat").value;
  const preco = parseFloat(document.getElementById("p_preco").value);
  const estoqueInicial = parseInt(document.getElementById("p_qtd").value);

  const novo = {
    id: Date.now(),
    nome,
    cat,
    preco,
    estoqueInicial
  };

  state.produtos.push(novo);
  salvarProdutos();
  registrarLog(`[CADASTRO] Produto adicionado: ${nome}`);
  state.modal = null;
  toast("Produto cadastrado com sucesso!");
  render();
}

function removerProduto(id) {
  if (confirm("Tem certeza que deseja excluir este produto?")) {
    state.produtos = state.produtos.filter(p => p.id !== id);
    salvarProdutos();
    registrarLog(`[EXCLUSÃO] Produto removido ID: ${id}`);
    render();
  }
}

/* ============================================================
   EVENT BINDING & INICIALIZAÇÃO
============================================================ */
function bind() {
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = () => {
      const act = btn.getAttribute("data-action");
      if (act === "recepcao") state.modo = "recepcao";
      if (act === "admin") state.modo = "administrativo";
      render();
    };
  });

  document.querySelectorAll("[data-conf]").forEach(btn => {
    btn.onclick = () => {
      state.conf = parseInt(btn.getAttribute("data-conf"));
      render();
    };
  });

  const dataEl = document.getElementById("data");
  if (dataEl) {
    dataEl.onchange = (e) => {
      state.data = e.target.value;
      state.dia = carregarDia();
      render();
    };
  }

  const respEl = document.getElementById("responsavel");
  if (respEl) {
    respEl.onchange = (e) => alterarResponsavel(e.target.value);
  }
}

// Render Inicial
render();
</script>
